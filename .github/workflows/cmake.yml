name: CMake

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

env:
  BUILD_TYPE: Debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      shell: bash
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libgflags-dev libcurl4-openssl-dev libssl-dev libaio-dev libnl-3-dev libnl-genl-3-dev libzstd-dev
        sudo apt-get install -y uuid-dev libjson-c-dev libkmod-dev libsystemd-dev autoconf automake libtool libpci-dev nasm pkg-config help2man
        sudo apt-get install -y libext2fs-dev fio jq lsscsi
        wget https://github.com/google/googletest/archive/refs/tags/release-1.11.0.tar.gz
        tar -zxvf release-1.11.0.tar.gz
        cd googletest-release-1.11.0/
        cmake CMakeLists.txt
        make
        sudo make install

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: |
        git submodule update --init
        # Force the ublk frontend ON: its unit test (ublk_dispatch_test) is pure
        # logic that needs no ublk-capable kernel, and BUILD_UBLK_FRONTEND now
        # auto-detects kernel support by default, which would skip it on a runner
        # whose kernel/modules do not expose ublk.
        cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_TESTING=1 -DBUILD_UBLK_FRONTEND=on -DENABLE_DSA=1 -DENABLE_ISAL=1

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: make -j64

    - name: E2E Test OverlayBD
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: |
        lscpu
        sudo make install
        sudo cp ${{github.workspace}}/src/example_config/overlaybd-registryv2.json /etc/overlaybd/overlaybd.json
        grep -Eq '"cacheType"[[:space:]]*:[[:space:]]*"file"' /etc/overlaybd/overlaybd.json
        sudo install -d -m 0755 /opt/overlaybd/registry_cache
        sudo find /opt/overlaybd/registry_cache -mindepth 1 -delete
        sudo systemctl enable /opt/overlaybd/overlaybd-tcmu.service
        sudo systemctl start overlaybd-tcmu
        sudo systemctl status overlaybd-tcmu
        sudo mkdir -p /var/lib/overlaybd/test/
        sudo mkdir -p /sys/kernel/config/target/core/user_1/vol1
        echo -n dev_config=overlaybd/${{github.workspace}}/src/example_config/redis.obd.config.json | sudo tee /sys/kernel/config/target/core/user_1/vol1/control
        echo -n 1 | sudo tee /sys/kernel/config/target/core/user_1/vol1/enable
        sudo mkdir -p /sys/kernel/config/target/loopback/naa.123456789abcdef/tpgt_1/lun/lun_0
        echo -n "naa.123456789abcdef" | sudo tee /sys/kernel/config/target/loopback/naa.123456789abcdef/tpgt_1/nexus
        sudo ln -s /sys/kernel/config/target/core/user_1/vol1 /sys/kernel/config/target/loopback/naa.123456789abcdef/tpgt_1/lun/lun_0/vol1
        lsblk
        dev=$(lsscsi | awk '/TCMU/ {print $7; exit}')
        test -b "$dev"
        echo "$dev"
        mkdir obd_mp
        sudo mount -o ro "$dev" obd_mp
        ls obd_mp

        # Exercise OverlayBD while the filesystem is mounted. direct=1 opens the
        # raw block device with O_DIRECT, so Linux's block/page cache cannot
        # satisfy these reads before they reach OverlayBD.
        cache_blocks_before=$(sudo find /opt/overlaybd/registry_cache -type f -printf '%b\n' | awk '{blocks += $1} END {print blocks + 0}')
        sudo fio \
          --name=overlaybd-file-cache-fill \
          --filename="$dev" \
          --readonly \
          --direct=1 \
          --ioengine=libaio \
          --rw=randread \
          --bs=4k \
          --iodepth=32 \
          --numjobs=8 \
          --time_based=1 \
          --runtime=20 \
          --randrepeat=1 \
          --randseed=20260821 \
          --group_reporting=1
        cache_blocks_after=$(sudo find /opt/overlaybd/registry_cache -type f -printf '%b\n' | awk '{blocks += $1} END {print blocks + 0}')
        test "$cache_blocks_after" -gt "$cache_blocks_before"

        # Repeat the same high-concurrency direct-I/O workload so the requests
        # traverse OverlayBD again and hit the file cache populated above.
        fio_result="$RUNNER_TEMP/overlaybd-file-cache-hit.json"
        sudo fio \
          --name=overlaybd-file-cache-hit \
          --filename="$dev" \
          --readonly \
          --direct=1 \
          --ioengine=libaio \
          --rw=randread \
          --bs=4k \
          --iodepth=32 \
          --numjobs=8 \
          --time_based=1 \
          --runtime=20 \
          --randrepeat=1 \
          --randseed=20260821 \
          --group_reporting=1 \
          --output-format=json \
          --output="$fio_result"
        iops=$(jq -r '.jobs[0].read.iops | floor' "$fio_result")
        echo "OverlayBD file-cache random-read IOPS: $iops"
        echo "::notice title=OverlayBD file-cache IOPS::$iops (4k randread, iodepth=32, numjobs=8)"
        # Not a performance gate - runners vary ~1.5x (90k-135k for this profile
        # across three runs of identical code). 60k sits above the single-vCPU
        # range (22k-41k), so it only catches multi-vCPU failing to engage;
        # tcmu-performance.yml is the actual performance gate.
        if ((iops < 60000)); then
          echo "::error title=OverlayBD IOPS regression::Expected at least 60000 IOPS, got $iops"
          exit 1
        fi
        sudo systemctl is-active --quiet overlaybd-tcmu
        sudo umount obd_mp
        ls -l /sys/kernel/config/target/loopback/naa.123456789abcdef/tpgt_1/lun/lun_0/vol1
        sudo unlink /sys/kernel/config/target/loopback/naa.123456789abcdef/tpgt_1/lun/lun_0/vol1
        wget https://overlaybd.blob.core.windows.net/overlaybd/e2etest.tar.gz
        gzip -k -d e2etest.tar.gz
        mkdir test_data
        tar -zxvf e2etest.tar.gz -C test_data/
        truncate -s 2g img1
        truncate -s 2g img2
        /opt/overlaybd/bin/overlaybd-apply --mkfs --raw e2etest.tar img1
        sleep 2
        /opt/overlaybd/bin/overlaybd-apply --mkfs --raw e2etest.tar img2
        diff img1 img2
        sudo mount -o ro img1 obd_mp
        ls obd_mp
        sudo diff -r --exclude "lost+found" test_data obd_mp
        sudo umount obd_mp
        cat /var/log/overlaybd.log
    - name: E2E Test turboOCIv1
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: |
        sudo make install
        sudo cp ${{github.workspace}}/src/example_config/overlaybd-registryv2.json /etc/overlaybd/overlaybd.json
        sudo systemctl enable /opt/overlaybd/overlaybd-tcmu.service
        sudo systemctl start overlaybd-tcmu
        sudo systemctl status overlaybd-tcmu
        sudo wget https://overlaybd.blob.core.windows.net/overlaybd/e2etest.tar.gz
        sudo mkdir -p /var/lib/overlaybd/test/
        sudo tar -zxvf e2etest.tar.gz -C /var/lib/overlaybd/test/
        sudo mkdir -p /sys/kernel/config/target/core/user_1/vol2
        echo -n dev_config=overlaybd//var/lib/overlaybd/test/20/block/config.v1.json | sudo tee /sys/kernel/config/target/core/user_1/vol2/control
        echo -n 1 | sudo tee /sys/kernel/config/target/core/user_1/vol2/enable
        sudo mkdir -p /sys/kernel/config/target/loopback/naa.987654321abcdef/tpgt_1/lun/lun_0
        echo -n "naa.987654321abcdef" | sudo tee /sys/kernel/config/target/loopback/naa.987654321abcdef/tpgt_1/nexus
        sudo ln -s /sys/kernel/config/target/core/user_1/vol2 /sys/kernel/config/target/loopback/naa.987654321abcdef/tpgt_1/lun/lun_0/vol2
        lsblk
        dev=$(lsscsi | awk '/TCMU/ {print $7; exit}')
        test -b "$dev"
        echo "$dev"
        sudo mkdir foci_mp
        sudo mount -o ro "$dev" foci_mp
        ls foci_mp
        sudo umount foci_mp
        sudo unlink /sys/kernel/config/target/loopback/naa.987654321abcdef/tpgt_1/lun/lun_0/vol2
    - name: E2E Test ublk
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: |
        sudo make install
        sudo cp ${{github.workspace}}/src/example_config/overlaybd-registryv2.json /etc/overlaybd/overlaybd.json
        # ublk_drv ships in linux-modules-extra-$(uname -r), which the base runner
        # image may not install; add it if the first modprobe fails (mainline >= 6.0).
        sudo modprobe ublk_drv || {
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          sudo modprobe ublk_drv
        }
        ls -l /dev/ublk-control
        # The overlaybd test image is normally already extracted by the turboOCIv1
        # step above (same job/runner); materialize it here as well so this step is
        # self-contained and does not silently depend on step ordering.
        cfg=/var/lib/overlaybd/test/20/block/config.v1.json
        if [ ! -f "$cfg" ]; then
          sudo mkdir -p /var/lib/overlaybd/test/
          [ -f e2etest.tar.gz ] || sudo wget https://overlaybd.blob.core.windows.net/overlaybd/e2etest.tar.gz
          sudo tar -zxf e2etest.tar.gz -C /var/lib/overlaybd/test/
        fi
        # `add` forks a detached daemon and prints /dev/ublkbN once ready. Bound it
        # with a timeout: a broken ublk kernel leaves ADD_DEV hanging forever
        # (actions/runner-images#14175), which would otherwise wedge the whole job.
        dev=`sudo timeout 120 /opt/overlaybd/bin/overlaybd-ublk add --config $cfg` || {
          echo "::error::overlaybd-ublk add failed/timed out on kernel $(uname -r) (cf. actions/runner-images#14175)"
          sudo dmesg | tail -40 || true
          exit 1
        }
        echo "ublk device: $dev"
        lsblk
        sudo /opt/overlaybd/bin/overlaybd-ublk list
        devid=${dev#/dev/ublkb}
        sudo mkdir -p ublk_mp
        sudo mount -o ro $dev ublk_mp
        ls ublk_mp
        sudo umount ublk_mp
        # always unmount before del; del stops the daemon and removes /dev/ublkbN
        sudo /opt/overlaybd/bin/overlaybd-ublk del -n $devid
    - name: E2E Test ublk pool
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: |
        # ublk_drv may live in linux-modules-extra (see the ublk step above).
        sudo modprobe ublk_drv || {
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          sudo modprobe ublk_drv
        }
        ls -l /dev/ublk-control
        sudo make install
        W=$RUNNER_TEMP/ublk-pool
        rm -rf "$W"
        mkdir -p "$W/img" "$W/cache"
        echo "{\"logConfig\":{\"logLevel\":1,\"logPath\":\"$W/ublkd.log\"},\"cacheConfig\":{\"cacheType\":\"file\",\"cacheDir\":\"$W/cache\",\"cacheSizeGB\":1},\"gzipCacheConfig\":{\"enable\":false},\"credentialConfig\":{\"mode\":\"file\",\"path\":\"$W/cred.json\"},\"ioEngine\":0,\"workpoolSize\":4,\"download\":{\"enable\":false},\"p2pConfig\":{\"enable\":false},\"exporterConfig\":{\"enable\":false,\"uriPrefix\":\"/metrics\",\"port\":9863,\"updateInterval\":1000000}}" > "$W/service.json"
        create=/opt/overlaybd/bin/overlaybd-create
        [ -x "$create" ] || create=${{github.workspace}}/build/output/overlaybd-create
        cfgs=""
        for i in 0 1 2 3 4 5 6 7; do
          "$create" -s "$W/img/$i.data" "$W/img/$i.index" 1
          printf '{"lowers":[],"upper":{"index":"%s","data":"%s"}}\n' \
            "$W/img/$i.index" "$W/img/$i.data" > "$W/img/$i.json"
          cfgs="$cfgs $W/img/$i.json"
        done
        sudo /opt/overlaybd/bin/overlaybd-ublkd \
          --socket-path "$W/ublkd.sock" \
          --service-config "$W/service.json" \
          --cache-dir "$W/cache" \
          --pool-low 8 --pool-high 8 --pool-size-gb 1 \
          > "$W/daemon.out" 2>&1 &
        dpid=$!
        ready=no
        for _ in $(seq 1 150); do
          if [ -S "$W/ublkd.sock" ]; then ready=yes; break; fi
          sudo kill -0 "$dpid" 2>/dev/null || break
          sleep 0.2
        done
        if [ "$ready" != yes ]; then
          echo "::error::overlaybd-ublkd did not come up on kernel $(uname -r)"
          cat "$W/daemon.out" || true
          sudo dmesg | tail -40 || true
          sudo kill "$dpid" 2>/dev/null || true
          exit 1
        fi
        # Concurrent acquire/release with a continuous /v1/list reader; the
        # script also asserts that no device is left after the last release.
        # shellcheck disable=SC2086
        rc=0
        sudo python3 ${{github.workspace}}/src/ublk/test/pool_stress.py \
          "$W/ublkd.sock" 8 $cfgs || rc=$?
        # sudo runs the daemon as its child, so address the daemon by its unique
        # socket path and wait for the device nodes to disappear.
        sudo pkill -TERM -f "overlaybd-ublkd --socket-path $W/ublkd.sock" || true
        for _ in $(seq 1 100); do
          ls /dev/ublkb* >/dev/null 2>&1 || break
          sleep 0.2
        done
        sudo pkill -9 -f "overlaybd-ublkd --socket-path $W/ublkd.sock" || true
        cat "$W/ublkd.log" 2>/dev/null | tail -40 || true
        if [ $rc -ne 0 ]; then
          echo "::error::ublk pool stress failed"
          exit $rc
        fi
        if ls /dev/ublkb* >/dev/null 2>&1; then
          echo "::error::ublk devices left after daemon shutdown"
          ls -l /dev/ublkb* || true
          exit 1
        fi
    - name: Unit Test
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: ctest -j8 --output-on-failure -C $BUILD_TYPE
